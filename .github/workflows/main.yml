name: Auto Release

on:
  push:
    branches:
      - main                # با هر push روی main یک ریلیز جدید می‌سازد
  workflow_dispatch:        # اجرای دستی بدون نیاز به تگ

permissions:
  contents: write           # 🔑 این خط مجوز ایجاد ریلیز را می‌دهد

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # رفع اخطار (اختیاری)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # در صورت نیاز به build (Tailwind و غیره) کامنت‌ها را بردارید
      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      #
      # - name: Install dependencies & build
      #   run: |
      #     npm ci
      #     npm run build

      - name: Create release archive
        run: |
          zip -r release.zip \
            assets \
            dist \
            src \
            package.json \
            package-lock.json \
            tailwind.config.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_id }}
          files: release.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
