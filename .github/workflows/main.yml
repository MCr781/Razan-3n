name: Auto Release

on:
  push:
    branches:
      - main                # هر بار push روی main یک ریلیز جدید می‌سازد
  workflow_dispatch:        # امکان اجرای دستی هم باقی می‌ماند

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # رفع اخطار منسوخ شدن Node 20 (اختیاری)
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # (اختیاری) اگر به build نیاز دارید، کامنت‌ها را بردارید
      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      #
      # - name: Install dependencies & build
      #   run: |
      #     npm ci
      #     npm run build

      - name: Create release archive
        run: |
          zip -r release.zip \
            assets \
            dist \
            src \
            package.json \
            package-lock.json \
            tailwind.config.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_id }}   # تگ یکتا برای هر اجرا
          files: release.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
