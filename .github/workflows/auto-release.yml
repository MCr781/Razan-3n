name: Auto Versioned Release

on:
  push:
    branches:
      - main

jobs:
  auto-tag-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # لازم برای زدن تگ و ساخت ریلیز

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # همه تگ‌ها و تاریخچه را بیاور

      - name: پیدا کردن آخرین تگ vc*
        id: last_tag
        run: |
          # تمام تگ‌های شبیه vc<number> را بگیر، مرتب به صورت ورژنی (vc1, vc2, ...)
          LAST_TAG=$(git tag -l "vc[0-9]*" --sort=v:refname | tail -n 1)

          if [ -z "$LAST_TAG" ]; then
            echo "هیچ تگ vc* وجود ندارد، شروع از vc1"
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          else
            echo "آخرین تگ: $LAST_TAG"
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "last=$LAST_TAG" >> $GITHUB_OUTPUT
          fi

      - name: محاسبه تگ جدید
        id: new_tag
        run: |
          if [ "${{ steps.last_tag.outputs.tag_exists }}" = "true" ]; then
            LAST="${{ steps.last_tag.outputs.last }}"
            # جدا کردن عدد بعد از vc
            NUM=${LAST#vc}
            NEXT=$((NUM + 1))
          else
            NEXT=1
          fi

          NEW_TAG="vc${NEXT}"
          echo "تگ جدید: $NEW_TAG"
          echo "name=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: ساخت تگ جدید و push کردن آن
        run: |
          NEW_TAG="${{ steps.new_tag.outputs.name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # تگ را روی آخرین commit بساز
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: آماده کردن فایل‌های ریلیز
        run: |
          mkdir -p release
          cp -r assets release/
          cp -r dist release/
          cp package.json release/
          cp package-lock.json release/
          cp -r src release/
          cp tailwind.config.js release/

      - name: ساخت فایل ZIP
        run: |
          TAG="${{ steps.new_tag.outputs.name }}"
          ZIP_NAME="Razan-${TAG}.zip"
          cd release
          zip -r "../${ZIP_NAME}" .
          cd ..
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: گرفتن پیام آخرین کامیت
        id: msg
        run: |
          MSG=$(git log -1 --pretty=%B)
          MSG="${MSG//$'\n'/ }"
          echo "message=$MSG" >> $GITHUB_OUTPUT

      - name: ساخت Release در گیتهاب
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.new_tag.outputs.name }}      # مثلا vc3
          name: ${{ steps.msg.outputs.message }}           # عنوان ریلیز = پیام کامیت
          body: |
            Automated release for tag `${{ steps.new_tag.outputs.name }}`

            Commit message:
            ${{ steps.msg.outputs.message }}
          files: ${{ env.ZIP_NAME }}                       # مثلا Razan-vc3.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
