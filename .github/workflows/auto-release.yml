name: Auto Versioned Release

on:
  push:
    branches:
      - main

jobs:
  auto-tag-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # لازم برای زدن تگ و ساخت ریلیز

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # همه تگ‌ها و تاریخچه را بیاور

      # 1) پیدا کردن آخرین تگ vc*
      - name: پیدا کردن آخرین تگ vc*
        id: last_tag
        run: |
          LAST_TAG=$(git tag -l "vc[0-9]*" --sort=v:refname | tail -n 1)

          if [ -z "$LAST_TAG" ]; then
            echo "هیچ تگ vc* وجود ندارد، شروع از vc1"
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          else
            echo "آخرین تگ: $LAST_TAG"
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "last=$LAST_TAG" >> $GITHUB_OUTPUT
          fi

      # 2) محاسبه تگ جدید
      - name: محاسبه تگ جدید
        id: new_tag
        run: |
          if [ "${{ steps.last_tag.outputs.tag_exists }}" = "true" ]; then
            LAST="${{ steps.last_tag.outputs.last }}"
            NUM=${LAST#vc}
            NEXT=$((NUM + 1))
          else
            NEXT=1
          fi

          NEW_TAG="vc${NEXT}"
          echo "تگ جدید: $NEW_TAG"
          echo "name=$NEW_TAG" >> $GITHUB_OUTPUT

      # 3) گرفتن پیام آخرین کامیت
      - name: گرفتن پیام آخرین کامیت
        id: msg
        run: |
          # پیام کامل کامیت (ممکنه چند خطی باشه)
          RAW_MSG=$(git log -1 --pretty=%B)

          # عنوان (title) = خط اول پیام
          TITLE=$(echo "$RAW_MSG" | head -n1)

          # برای استفاده در فایل و خروجی، Line break ها رو به فاصله تبدیل می‌کنیم
          ONE_LINE_MSG=${RAW_MSG//$'\n'/ }

          echo "raw=$RAW_MSG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "single_line=$ONE_LINE_MSG" >> $GITHUB_OUTPUT

      # 4) ساخت تگ جدید و push کردن آن
      - name: ساخت تگ جدید و push کردن آن
        run: |
          NEW_TAG="${{ steps.new_tag.outputs.name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      # 5) آماده کردن فایل‌های ریلیز
      - name: آماده کردن فایل‌های ریلیز
        run: |
          mkdir -p release
          cp -r assets release/
          cp -r dist release/
          cp package.json release/
          cp package-lock.json release/
          cp -r src release/
          cp tailwind.config.js release/

      # 6) ساخت فایل ZIP با نام پیام کامیت
      - name: ساخت فایل ZIP
        id: zip
        run: |
          # استفاده از پیام تک‌خطی برای نام فایل
          MSG="${{ steps.msg.outputs.single_line }}"

          # تبدیل فاصله‌ها به _ برای فایل‌نیم
          SAFE_MSG=${MSG// /_}

          # حذف کاراکترهای مشکل‌دار برای فایل‌سیستم (ساده و محافظه‌کارانه)
          SAFE_MSG=${SAFE_MSG//\//-}
          SAFE_MSG=${SAFE_MSG//:/-}
          SAFE_MSG=${SAFE_MSG//\\/-}
          SAFE_MSG=${SAFE_MSG//\"/}
          SAFE_MSG=${SAFE_MSG//\'/}
          SAFE_MSG=${SAFE_MSG//\*/}
          SAFE_MSG=${SAFE_MSG//\?/}
          SAFE_MSG=${SAFE_MSG//</}
          SAFE_MSG=${SAFE_MSG//>/}
          SAFE_MSG=${SAFE_MSG//\|/}

          ZIP_NAME="${SAFE_MSG}.zip"

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT

          cd release
          zip -r "../${ZIP_NAME}" .
          cd ..

      # 7) ساخت متن Full Changelog (previous...new)
      - name: ساخت متن Full Changelog
        id: changelog
        run: |
          NEW_TAG="${{ steps.new_tag.outputs.name }}"

          if [ "${{ steps.last_tag.outputs.tag_exists }}" = "true" ]; then
            PREV_TAG="${{ steps.last_tag.outputs.last }}"
            RANGE="${PREV_TAG}...${NEW_TAG}"
          else
            # اگر تگ قبلی نباشه، مثلا اولین ریلیز
            PREV_TAG=""
            RANGE="${NEW_TAG}"
          fi

          echo "previous=${PREV_TAG}" >> $GITHUB_OUTPUT
          echo "range=${RANGE}" >> $GITHUB_OUTPUT

      # 8) ساخت Release در گیتهاب با لینک قابل کلیک
      - name: ساخت Release در گیتهاب
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.new_tag.outputs.name }}            # مثلا vc3
          name: ${{ steps.msg.outputs.title }}                   # عنوان ریلیز = خط اول پیام کامیت
          body: |
            ${{ steps.msg.outputs.raw }}

            ${{ steps.last_tag.outputs.tag_exists == 'true' && format('[Full Changelog](https://github.com/MCr781/Razan-3n/compare/{0}...{1})', steps.changelog.outputs.previous, steps.new_tag.outputs.name) || '' }}
          files: ${{ env.ZIP_NAME }}                             # مثلا Razan_3.5F.zip یا هرچی
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
